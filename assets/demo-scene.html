<!doctype html>
<html><head><meta charset="utf-8"><title>truly-done demo scene</title>
<style>
html,body{margin:0;background:#0b1020;overflow:hidden}
svg{display:block;width:1200px;height:760px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style></head>
<body>
<!-- Self-contained, no network. Recorded with make_demo.sh into assets/demo.gif. -->
<svg id="s" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="40" y="58" fill="#e2e8f0" font-size="30" font-weight="700">truly-done</text>
  <text x="40" y="88" fill="#94a3b8" font-size="17">the agent says "done" · the watchdog checks the running app</text>

  <!-- agent bubble -->
  <g id="bubble" opacity="0">
    <rect x="840" y="40" width="300" height="50" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="990" y="72" text-anchor="middle" fill="#e2e8f0" font-size="18">agent: "Done, it works ✓"</text>
  </g>

  <!-- the app window -->
  <g transform="translate(40,130)">
    <rect width="640" height="500" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect width="640" height="40" rx="14" fill="#1e293b"/><rect y="26" width="640" height="14" fill="#1e293b"/>
    <circle cx="20" cy="20" r="6" fill="#f87171"/><circle cx="40" cy="20" r="6" fill="#fbbf24"/><circle cx="60" cy="20" r="6" fill="#34d399"/>
    <rect x="90" y="9" width="420" height="22" rx="11" fill="#0f172a"/>
    <text x="104" y="25" fill="#94a3b8" font-size="13">localhost:3000</text>
    <g id="spin" opacity="0"><circle cx="490" cy="20" r="7" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="22 22"/></g>
    <text x="40" y="96" fill="#0f172a" font-size="30" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif">Todos</text>
    <rect x="40" y="120" width="420" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text id="typed" x="56" y="153" fill="#0f172a" font-size="20" font-family="-apple-system,Helvetica,Arial,sans-serif"></text>
    <rect id="btn" x="476" y="120" width="124" height="52" rx="10" fill="#2563eb"/>
    <text x="538" y="153" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif">Add</text>
    <g id="item" opacity="0">
      <rect x="40" y="200" width="560" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <rect x="58" y="218" width="20" height="20" rx="5" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="94" y="235" fill="#0f172a" font-size="20" font-family="-apple-system,Helvetica,Arial,sans-serif">Buy milk</text>
    </g>
    <text id="count" x="40" y="300" fill="#64748b" font-size="16" font-family="-apple-system,Helvetica,Arial,sans-serif">0 items</text>
    <text id="empty" x="320" y="236" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="-apple-system,Helvetica,Arial,sans-serif">Nothing to do yet</text>
    <circle id="ring" cx="538" cy="146" r="0" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0"/>
  </g>

  <!-- dog -->
  <circle id="hglow" cx="0" cy="0" r="70" fill="url(#glow)"/>
  <g id="dog"></g>

  <!-- claims panel -->
  <g transform="translate(720,130)">
    <rect width="440" height="400" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="22" y="38" fill="#e2e8f0" font-size="18" font-weight="700">claims, checked on the live page</text>
    <line x1="22" y1="52" x2="418" y2="52" stroke="#1e293b"/>
    <g id="claims"></g>
  </g>
  <g id="stamp" opacity="0" transform="translate(940,590)">
    <g id="stampg">
      <rect x="-220" y="-44" width="440" height="88" rx="14" fill="#450a0a" stroke="#ef4444" stroke-width="4"/>
      <text x="0" y="-4" text-anchor="middle" fill="#fecaca" font-size="30" font-weight="800">VERDICT FAIL</text>
      <text x="0" y="26" text-anchor="middle" fill="#fca5a5" font-size="15">gone after reload · exit 1 · not done</text>
    </g>
  </g>
  <text x="40" y="720" fill="#22d3ee" font-size="18">$ verify.py run flows/add-todo.json --url http://localhost:3000</text>
</svg>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const CL=[['the new todo shows in the list',1],['one POST was answered 201',1],['the counter says 1 item',1],
          ['still there after a reload',0],['no console errors',1]];
const rows=CL.map((c,i)=>{const g=el('g',{transform:`translate(22,${92+i*62})`,opacity:.35},$('claims'));
  const b=el('rect',{width:396,height:46,rx:10,fill:'#111c33',stroke:'#334155','stroke-width':2},g);
  const m=el('text',{x:22,y:30,'text-anchor':'middle','font-size':20,'font-weight':800,fill:'#64748b'},g);m.textContent='·';
  const t=el('text',{x:46,y:30,'font-size':16,fill:'#cbd5e1'},g);t.textContent=c[0];return {g,b,m,t}});
// dog: a simple dog seen from the side
const h=$('dog');
const tail=el('path',{fill:'none',stroke:'#e2e8f0','stroke-width':5,'stroke-linecap':'round'},h);
const legs=[0,1,2,3].map(()=>el('line',{stroke:'#e2e8f0','stroke-width':6,'stroke-linecap':'round'},h));
el('rect',{x:-36,y:-18,width:66,height:30,rx:15,fill:'#0f172a',stroke:'#e2e8f0','stroke-width':4},h);
el('circle',{cx:38,cy:-22,r:17,fill:'#0f172a',stroke:'#e2e8f0','stroke-width':4},h);
el('path',{d:'M30,-36 Q20,-18 28,-6',fill:'#e2e8f0',stroke:'#e2e8f0','stroke-width':4,'stroke-linejoin':'round'},h);
el('rect',{x:50,y:-22,width:16,height:11,rx:5,fill:'#0f172a',stroke:'#e2e8f0','stroke-width':4},h);
el('circle',{cx:67,cy:-18,r:3.5,fill:'#22d3ee'},h);el('circle',{cx:42,cy:-26,r:3,fill:'#22d3ee'},h);
const T=8000,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,cl=(v,a,b)=>Math.max(0,Math.min(1,(v-a)/(b-a)));
// dog waypoints (x,y) over time (ms)
const P=[[0,-60,585],[900,250,585],[1900,250,585],[2500,470,585],[5600,470,585],[6300,620,585],[8000,620,585]];
function pos(t){for(let i=1;i<P.length;i++)if(t<=P[i][0]){const a=P[i-1],b=P[i],k=ease((t-a[0])/(b[0]-a[0]));return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,a[1]!==b[1]]}return [P[P.length-1][1],585,false]}
const TEXT='Buy milk';
function frame(now){const t=((now-start)%T+T)%T;
  $('bubble').setAttribute('opacity',cl(t,100,500));
  const [x,y,walk]=pos(t);h.setAttribute('transform',`translate(${x},${y})`);$('hglow').setAttribute('transform',`translate(${x},${y})`);
  legs.forEach((l,i)=>{const bx=[-26,-12,10,22][i],sw=walk?Math.sin(now/60+i*1.6)*9:0;l.setAttribute('x1',bx);l.setAttribute('y1',10);l.setAttribute('x2',bx+sw);l.setAttribute('y2',34)});
  const wag=Math.sin(now/90)*10;tail.setAttribute('d',`M-34,-8 Q-52,${-26+wag} -58,${-40+wag}`);
  // typing 1000-1900, click 2500, item 2650, reload 4300-4700 (item gone)
  $('typed').textContent=t<1000?'':t<2650?TEXT.slice(0,Math.ceil(cl(t,1000,1850)*TEXT.length)):'';
  const k=cl(t,2500,2900);$('ring').setAttribute('r',k*46);$('ring').setAttribute('opacity',t>2500&&t<2900?1-k:0);
  $('btn').setAttribute('fill',t>2500&&t<2700?'#1d4ed8':'#2563eb');
  const reload=t>4300&&t<4750,gone=t>=4300,shown=t>=2650&&!gone;
  $('item').setAttribute('opacity',shown?1:0);$('empty').setAttribute('opacity',shown||reload?0:1);
  $('count').textContent=shown?'1 item':'0 items';
  $('spin').setAttribute('opacity',reload?1:0);$('spin').setAttribute('transform',`rotate(${now/2%360} 490 20)`);
  // claims resolve at these times
  const AT=[2950,3350,3750,5000,5400];
  rows.forEach((r,i)=>{const on=t>=AT[i],ok=CL[i][1],act=t>=AT[i]-380&&!on;
    r.g.setAttribute('opacity',on||act?1:.35);
    r.b.setAttribute('stroke',on?(ok?'#22c55e':'#ef4444'):act?'#22d3ee':'#334155');r.b.setAttribute('fill',on?(ok?'#0f2a1d':'#2a0f0f'):'#111c33');
    r.m.textContent=on?(ok?'✓':'✗'):'·';r.m.setAttribute('fill',on?(ok?'#4ade80':'#f87171'):'#64748b');
    r.t.setAttribute('fill',on?(ok?'#bbf7d0':'#fecaca'):'#cbd5e1')});
  const s=cl(t,5900,6250);$('stamp').setAttribute('opacity',s);$('stampg').setAttribute('transform',`scale(${1.5-.5*ease(s)}) rotate(${-4*ease(s)})`);
}
let start=performance.now(),timer=setInterval(()=>frame(performance.now()),33);
// Recorder hook: make_demo.sh steps the scene frame by frame through demoSeek(ms).
window.demoSeek=ms=>{if(timer){clearInterval(timer);timer=0;start=0}frame(ms)};
</script>
</body></html>
