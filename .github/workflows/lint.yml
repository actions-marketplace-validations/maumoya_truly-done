# Lint: keyless checks on every PR (frontmatter, JSON, eval layout, risky patterns). No API key needed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    name: Lint skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: bash scripts/lint_skill.sh .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit and end-to-end tests (Chrome is preinstalled on the runner)
        run: python3 -m unittest discover -s tests -v

      - name: Benchmark still holds (9 planted bugs caught, 0 false alarms)
        run: python3 bench/run.py

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Atheris (hash-pinned)
        run: pip install --require-hashes -r tests/fuzz/requirements.txt

      - name: Fuzz the parsers for 60 seconds
        run: python tests/fuzz/fuzz_parsers.py -max_total_time=60
